<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сайт временно недоступен</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      color: #e2e8f0;
      overflow: hidden;
    }

    .container {
      text-align: center;
      padding: 40px 24px;
      max-width: 520px;
    }

    .icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 28px;
      border: 3px solid #38bdf8;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 1.1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    h1 {
      font-size: 1.85rem;
      font-weight: 600;
      margin-bottom: 16px;
      letter-spacing: -0.02em;
      color: #f8fafc;
    }

    p {
      font-size: 1.1rem;
      line-height: 1.6;
      color: #94a3b8;
      margin-bottom: 8px;
    }

    .hint {
      font-size: 0.95rem;
      color: #64748b;
      margin-top: 24px;
    }
  </style>
</head>
<body>
</body>
</html>
